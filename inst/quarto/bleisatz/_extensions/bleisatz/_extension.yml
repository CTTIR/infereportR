title: Bleisatz
author: R. Heller
version: 1.3.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    # Decks: format bleisatz-beamer
    beamer:
      template: bleisatz-beamer.latex
      theme: Bleisatz
      aspectratio: 169
      fontsize: 11pt
      slide-level: 2
      pdf-engine: pdflatex
      fig-format: pdf
      format-resources:
        - beamerthemeBleisatz.sty
    # Papers, reports and handouts: format bleisatz-pdf
    pdf:
      template: bleisatz-document.latex
      documentclass: bleisatz
      pdf-engine: pdflatex
      cite-method: biblatex
      fig-format: pdf
      format-resources:
        - bleisatz.cls
