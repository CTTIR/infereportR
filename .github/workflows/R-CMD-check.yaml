name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release, lane: full}
          - {os: ubuntu-latest, r: devel, lane: full, http-user-agent: release}
          - {os: ubuntu-latest, r: oldrel-1, lane: full}
          - {os: windows-latest, r: release, lane: full}
          - {os: macos-latest, r: release, lane: full}
          - {os: ubuntu-latest, r: '4.1', lane: minimal}
    env:
      INFER_SUITE_FULL: ${{ matrix.lane == 'full' && 'true' || 'false' }}
      _R_CHECK_FORCE_SUGGESTS_: 'false'
      TESTTHAT_CPUS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      # INFER_SUITE_TOKEN reads the private provider CTTIR/infercalcR. Once
      # that repository is public, the workflow token is enough.
      GITHUB_PAT: ${{ secrets.INFER_SUITE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify the provider infercalcR can be read
        shell: bash
        env:
          SUITE_TOKEN: ${{ secrets.INFER_SUITE_TOKEN }}
        run: |
          if [ -n "$SUITE_TOKEN" ]; then
            echo 'Using INFER_SUITE_TOKEN to read CTTIR/infercalcR.'
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/CTTIR/infercalcR)
          if [ "$status" != "200" ]; then
            echo '::error::CTTIR/infercalcR is not publicly readable and the INFER_SUITE_TOKEN secret is not set. Add a token with read access to CTTIR/infercalcR as INFER_SUITE_TOKEN, or make CTTIR/infercalcR public.'
            exit 1
          fi
          echo 'CTTIR/infercalcR is public; the workflow token suffices.'
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          dependencies: ${{ matrix.lane == 'full' && '"all"' || '"hard"' }}
          # Neither provider is on CRAN yet: infercalcR comes from GitHub, and
          # the optional DescrTab2 adapter is verified for one pinned commit.
          extra-packages: |
            any::rcmdcheck
            github::CTTIR/infercalcR
            ${{ matrix.lane == 'full' && 'github::imbi-heidelberg/DescrTab2@f157380e7abcb7964612a480e09e59a45e7a01be' || '' }}
          needs: check
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
