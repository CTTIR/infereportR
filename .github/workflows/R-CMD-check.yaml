name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release, lane: full}
          - {os: ubuntu-latest, r: devel, lane: full, http-user-agent: release}
          - {os: ubuntu-latest, r: oldrel-1, lane: full}
          - {os: windows-latest, r: release, lane: full}
          - {os: macos-latest, r: release, lane: full}
          - {os: ubuntu-latest, r: '4.1', lane: minimal}
    env:
      INFER_SUITE_FULL: ${{ matrix.lane == 'full' && 'true' || 'false' }}
      _R_CHECK_FORCE_SUGGESTS_: 'false'
      TESTTHAT_CPUS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          dependencies: ${{ matrix.lane == 'full' && '"all"' || '"hard"' }}
          # infercalcR is not on CRAN yet; the public package comes from GitHub.
          extra-packages: |
            any::rcmdcheck
            github::CTTIR/infercalcR
          needs: check
      # The minimal lane has no vignette builder (knitr is suggested), so it
      # skips the vignettes; the full lanes build and check them.
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          build_args: ${{ matrix.lane == 'full' && '"--no-manual"' || 'c("--no-manual", "--no-build-vignettes")' }}
          args: ${{ matrix.lane == 'full' && 'c("--no-manual", "--as-cran")' || 'c("--no-manual", "--as-cran", "--ignore-vignettes")' }}
          error-on: '"warning"'
